databaseChangeLog:
  - changeSet:
      id: 002-create-documents-table
      author: artur
      changes:
        - createTable:
            schemaName: vault
            tableName: documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: owner_org_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-document-versions-table
      author: artur
      changes:
        - createTable:
            schemaName: vault
            tableName: document_versions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: bucket
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: checksum_sha256
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vault
            baseTableName: document_versions
            baseColumnNames: document_id
            referencedTableSchemaName: vault
            referencedTableName: documents
            referencedColumnNames: id
            constraintName: fk_document_versions_document